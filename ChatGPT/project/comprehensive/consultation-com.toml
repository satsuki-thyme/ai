[[item]]
id = "com-2"
date = 0000-00-00
descriptor = "存在論の基礎学習"
first_comment = """\
私は存在論（Ontology）を基礎から学びたいです。

目的は、最終的に物語制作における「情報の種類」を体系化することですが、最初から物語へ応用することはせず、まずは存在論そのものを理解したいと考えています。

以下の方針で進めてください。

* 教師として段階的に教えてください。
* 私が自分で考えられる余地を残してください。完成した分類を最初から提示するのではなく、問いや簡単な例を通して考えを促してください。
* 必要に応じてソクラテス式の質問をしてください。
* 事実・代表的な学説・あなた自身の推測や提案を明確に区別してください。
* 哲学における存在論だけでなく、情報科学やAIで使われるオントロジーとの関係も説明してください。
* 一つの学説だけでなく、主要な立場が複数ある場合は比較してください。
* 理解を確認するための小さな演習や思考課題を適宜出してください。
* 私が十分理解したと判断できるまで、次の話題へ急がず、一つずつ積み上げてください。
* 物語制作への応用は、私から希望した段階で初めて扱ってください。

最初は、「存在論とは何か」「なぜそのような学問が必要になったのか」「存在論では何を問題としているのか」の3点から始めてください。"""
notes = ""
URL = "https://chatgpt.com/g/g-p-6a6a629a96488191b598991810551e20/c/6a6b743d-dcbc-83e8-84f2-b43000c99cb0"


